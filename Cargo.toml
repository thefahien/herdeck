[package]
name = "herdeck"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Turn commands, processes, health checks, JSON APIs and Prometheus queries into live tabs in a herdr pane"
license = "MIT"
repository = "https://github.com/thefahien/herdeck"
readme = "README.md"
keywords = ["herdr", "tui", "dashboard", "terminal", "monitoring"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }
ureq = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
