name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt, clippy, unit tests, build, pty e2e, privacy scan
        run: sh scripts/check.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: python3 tests/e2e.py target/release/herdeck

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin manifest and Cargo.toml agree on the version
        run: |
          a=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          b=$(sed -n 's/^version *= *"\(.*\)"/\1/p' herdr-plugin.toml | head -n1)
          echo "Cargo.toml=$a herdr-plugin.toml=$b"
          test "$a" = "$b"
