# herdeck: tabbed terminal dashboards inside herdr
id = "herdeck"
name = "herdeck"
version = "0.3.0"
description = "Turn any command, process list, health check, JSON API or Prometheus query into a tab in a herdr pane."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

# Fetch the release binary for this OS/CPU (sha256-checked), else cargo build.
[[build]]
command = ["sh", "scripts/install.sh"]

[[panes]]
id = "popup"
title = "herdeck"
placement = "popup"
command = ["sh", "scripts/pane.sh"]

[[panes]]
id = "split"
title = "herdeck"
placement = "split"
command = ["sh", "scripts/pane.sh"]

[[actions]]
id = "open"
title = "herdeck: open dashboards"
description = "Open the tabbed dashboards in a popup (Tab / 1-9 / mouse to switch tabs)."
command = ["bash", "scripts/open-pane.sh", "popup"]

[[actions]]
id = "split"
title = "herdeck: open in a split pane"
description = "Open the tabbed dashboards in a persistent split pane."
command = ["bash", "scripts/open-pane.sh", "split"]
